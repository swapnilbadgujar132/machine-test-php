services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/laravel/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - laravel_data:/var/lib/laravel
    restart: unless-stopped

volumes:
  laravel_data: